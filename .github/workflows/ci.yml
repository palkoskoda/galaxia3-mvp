name: CI - Build Check
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.0'
          cache: 'npm'
      - name: Build personal ordering app
        env:
          NODE_ENV: production
        run: |
          npm ci
          npm run build
          npm run menu:validate
      - name: Test menu reader and server
        run: npm test
      - name: Test production start
        run: bash scripts/render-start-check.sh
